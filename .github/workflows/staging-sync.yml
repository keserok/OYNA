# OYNA — canlı şemayı staging'e aktar (elle tetiklenir, pg_dump ile tam klon)
#
# Neden var: repo migration geçmişi "yaratılıştan" başlamıyor (taban şema Mayıs
# 2026'da elle kuruldu), bu yüzden boş projeye migration replay edilemez.
# Bu workflow canlının public şemasını pg_dump ile staging'e birebir klonlar.
# Aynı yöntem Frankfurt taşınmasında da kullanılacak (orada + veri dökümü).
#
# Gerekli secret'lar (repo → Settings → Secrets and variables → Actions):
#   SUPABASE_DB_URL   canlı proje Session pooler URI'si
#     Dashboard(OYNA) → Connect → Session pooler; [YOUR-PASSWORD] yerine
#     Settings → Database → Reset database password ile alınan şifre.
#   STAGING_DB_URL    staging proje (oyna-staging) Session pooler URI'si (aynı yöntem)
#
# Ne yapar: canlının public şemasının TAM yapısını (tablolar, view'lar, fonksiyonlar,
# politikalar, trigger'lar, indeksler, kısıtlar, GRANT'lar) staging'e taşır. VERİ TAŞIMAZ.
# İdempotenttir (--clean --if-exists): tekrar çalıştırılabilir.
name: staging-sync

on:
  workflow_dispatch: {}

jobs:
  sync-schema:
    runs-on: ubuntu-latest
    container: postgres:17
    steps:
      - name: Secret kontrolü
        env:
          LIVE: ${{ secrets.SUPABASE_DB_URL }}
          STG: ${{ secrets.STAGING_DB_URL }}
        run: |
          test -n "$LIVE" || { echo "::error::SUPABASE_DB_URL secret eksik"; exit 1; }
          test -n "$STG"  || { echo "::error::STAGING_DB_URL secret eksik"; exit 1; }

      - name: Staging'de uzantıları ön-kur (fonksiyonlar bunlara bağlı)
        env:
          STG: ${{ secrets.STAGING_DB_URL }}
        run: |
          psql "$STG" -v ON_ERROR_STOP=0 <<'SQL'
          create extension if not exists "uuid-ossp";
          create extension if not exists pgcrypto;
          create extension if not exists pg_trgm;
          create extension if not exists btree_gist;
          create extension if not exists cube;
          create extension if not exists earthdistance;
          create extension if not exists pg_net;
          SQL

      - name: Canlıdan public şema dökümü (yapı, GRANT dahil; idempotent)
        env:
          LIVE: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          # --no-owner: sahiplik staging'de farklı. GRANT'lar KORUNUR (RLS sadakati).
          # --clean --if-exists: her nesneyi DROP...IF EXISTS ile önceler → tekrar
          #   çalıştırılabilir + staging'deki artık nesneleri temizler.
          # Uzantı-sahibi fonksiyonlar (cube/earthdistance) pg_dump tarafından zaten
          #   hariç tutulur; onları yukarıdaki adımda uzantı olarak kurduk.
          pg_dump "$LIVE" --schema-only --no-owner --clean --if-exists \
            --schema=public -f schema_public.sql
          echo "satır: $(wc -l < schema_public.sql)"

      - name: Staging'e uygula
        env:
          STG: ${{ secrets.STAGING_DB_URL }}
        run: |
          # ON_ERROR_STOP=0: uzantı-zaten-var gibi zararsız hatalar es geçilir;
          # sonuç bir sonraki adımda sayılarla doğrulanır.
          psql "$STG" -v ON_ERROR_STOP=0 -f schema_public.sql 2>&1 | tail -40

      - name: Doğrulama — staging vs canlı nesne sayıları
        env:
          LIVE: ${{ secrets.SUPABASE_DB_URL }}
          STG: ${{ secrets.STAGING_DB_URL }}
        run: |
          Q="select
               (select count(*) from pg_tables  where schemaname='public') as tablo,
               (select count(*) from pg_views   where schemaname='public') as view,
               (select count(*) from pg_policies where schemaname='public') as politika,
               (select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace
                 where n.nspname='public' and not exists
                 (select 1 from pg_depend d where d.objid=p.oid and d.deptype='e')) as kullanici_fn;"
          echo '--- CANLI ---'; psql "$LIVE" -c "$Q"
          echo '--- STAGING ---'; psql "$STG" -c "$Q"

      - name: Şema dökümünü artifact olarak sakla
        uses: actions/upload-artifact@v4
        with:
          name: schema-baseline
          path: schema_public.sql
          retention-days: 30
