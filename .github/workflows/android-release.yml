# ─────────────────────────────────────────────────────────────────────────────
# Android Release — Google Play'e gönderilecek imzalı .aab üretimi
#
# Gerekli secrets (repo Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64    Upload keystore (.keystore) base64
#   ANDROID_KEYSTORE_PASSWORD  Keystore parolası
#   ANDROID_KEY_ALIAS          Anahtar alias'ı (örn. oyna-upload)
#   ANDROID_KEY_PASSWORD       Anahtar parolası
#
# Opsiyonel:
#   GOOGLE_SERVICES_JSON       google-services.json içeriği (FCM push için —
#                              yoksa AAB yine derlenir ama push çalışmaz)
# ─────────────────────────────────────────────────────────────────────────────
name: Android Release (Google Play)

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Web build + Capacitor sync
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: İmzalama dosyalarını hazırla
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/oyna-upload.keystore
          cat > android/key.properties <<EOF
          storeFile=../oyna-upload.keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          fi

      - name: AAB derle (bundleRelease)
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon

      - name: AAB artefaktını yayınla
        uses: actions/upload-artifact@v4
        with:
          name: OYNA-Android-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14
