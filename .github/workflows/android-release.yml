# ═══════════════════════════════════════════════════════════════════════════
# OYNA — Google Play icin AAB uretimi
#
# NE ISE YARAR: Bu is, Google Play'e yuklenecek kurulum paketini (.aab) senin
# yerine GitHub'in bilgisayarlarinda uretir. Kendi bilgisayarina Android
# Studio kurman GEREKMEZ.
#
# NASIL CALISTIRILIR:
#   GitHub'da depo sayfasi -> ust menuden "Actions" -> soldaki listeden
#   "Android — Google Play paketi (AAB)" -> sagdaki "Run workflow" dugmesi.
#   Bittiginde ayni sayfanin altindaki "Artifacts" bolumunden .aab dosyasini
#   indirirsin ve Play Console'a yuklersin.
#
# IMZALAMA: Play, paketin senin "yukleme anahtarinla" (upload key) imzalanmasini
#   ister. Anahtar deposu GitHub Secrets'ta saklanir (asla depoya konmaz).
#   Secret'lar tanimli DEGILSE is yine calisir ama IMZASIZ paket uretir —
#   imzasiz paket Play'e YUKLENEMEZ, yalnizca derlemenin saglamligini gosterir.
#
# GEREKEN SECRET'LAR (Settings -> Secrets and variables -> Actions):
#   ANDROID_KEYSTORE_BASE64  -> anahtar deposu dosyasinin base64 metni (zorunlu)
#   ANDROID_KEYSTORE_PASSWORD-> anahtar deposu sifresi                 (zorunlu)
#   ANDROID_KEY_ALIAS        -> anahtar takma adi                      (zorunlu)
#   ANDROID_KEY_PASSWORD     -> anahtar sifresi                        (zorunlu)
#   GOOGLE_SERVICES_JSON     -> Firebase google-services.json icerigi  (push icin)
#   VITE_SUPABASE_URL        -> Supabase adresi        (yoksa koddaki uretim yedegi)
#   VITE_SUPABASE_ANON_KEY   -> Supabase anon anahtari (yoksa koddaki uretim yedegi)
# ═══════════════════════════════════════════════════════════════════════════
name: Android — Google Play paketi (AAB)

on:
  workflow_dispatch:
    inputs:
      versionName:
        description: 'Surum adi (kullaniciya gorunen, or. 3.0.0)'
        required: false
        default: '3.0.0'
      buildApkToo:
        description: 'Telefona elle kurulabilen APK de uret (test icin)'
        type: boolean
        required: false
        default: false

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-aab:
    name: AAB uret
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # GECICI: asagidaki "teslimat" adiminin gecici dala islem yapabilmesi icin.
    # Teslimat bitince bu blok da adim da kaldirilir.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Node kur
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Java 21 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: Bagimliliklari kur
        run: npm ci

      # Kalite kapisi: tip kontrolu ve birim testleri gecmeden paket uretilmez.
      # Boylece bozuk bir surum Play'e yuklenemez.
      - name: Tip kontrolu (tsc)
        run: npm run lint

      - name: Birim testleri
        run: npm run test:unit

      - name: Web uygulamasini derle
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ secrets.VITE_POSTHOG_HOST }}

      - name: Yasal sayfalari uret
        run: npm run build:legal
        continue-on-error: true

      - name: Firebase yapilandirmasi (push bildirimleri)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "::notice::google-services.json yazildi — push bildirimleri aktif."
          else
            echo "::warning::GOOGLE_SERVICES_JSON secret'i yok — bu pakette ANDROID PUSH BILDIRIMLERI CALISMAZ."
          fi

      # Uygulama ikonu ve acilis ekrani, assets/ altindaki ana gorsellerden
      # HER DERLEMEDE yeniden uretilir. Bu adim olmadan android/.../res/mipmap-*
      # klasorleri depoya bir kez islenmis eski gorsellerle kalir ve marka
      # degisince sessizce eskiyorlar (2026-07-30'da tam bu oldu: uygulama
      # ikonu eski simsek logosunda kalmisti). Kaynak degisirse ikon otomatik
      # degisir; elle senkron tutmaya gerek yoktur.
      - name: Uygulama ikonu ve acilis ekranini uret
        run: npm run assets:generate

      - name: Capacitor senkronizasyonu
        run: npx cap sync android

      - name: Imzalama anahtarini hazirla
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > android/oyna-upload.keystore
            # key.properties, android/app/build.gradle tarafindan okunur.
            {
              echo "storeFile=../oyna-upload.keystore"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > android/key.properties
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Paket YUKLEME ANAHTARIYLA imzalanacak."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Imzalama secret'lari eksik — IMZASIZ paket uretilecek. Bu paket Play Console'a YUKLENEMEZ."
          fi

      # versionCode her calistirmada artmali (Play ayni sayiyi ikinci kez kabul etmez).
      # github.run_number her turda 1 artan bir sayidir; buna sabit bir taban ekliyoruz.
      - name: Surum numaralarini hesapla
        id: ver
        run: |
          echo "code=$(( 1000 + ${{ github.run_number }} ))" >> "$GITHUB_OUTPUT"
          echo "name=${{ inputs.versionName }}" >> "$GITHUB_OUTPUT"

      - name: AAB derle
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease --no-daemon --stacktrace \
            -PoynaVersionCode=${{ steps.ver.outputs.code }} \
            -PoynaVersionName=${{ steps.ver.outputs.name }}

      - name: APK derle (istege bagli, YAYIN surumu)
        if: ${{ inputs.buildApkToo }}
        working-directory: android
        run: |
          ./gradlew assembleRelease --no-daemon \
            -PoynaVersionCode=${{ steps.ver.outputs.code }} \
            -PoynaVersionName=${{ steps.ver.outputs.name }}

      # ── TELEFONA KURULABILEN APK ─────────────────────────────────────────
      # NEDEN AYRI BIR "debug" PAKETI: yayin (release) paketi, imzalama
      # secret'lari tanimli DEGILSE IMZASIZ cikar. Android imzasiz bir APK'yi
      # KURMAZ — yani anahtar yokken uretilen release APK telefonda ise
      # yaramaz, sadece "derleme calisiyor" demektir.
      #
      # Debug paketini Android'in kendi hazir anahtariyla otomatik imzalar.
      # Play'e yuklenemez ama TELEFONA KURULUR. Kurucu uygulamayi kendi
      # cihazinda gormek istediginde ihtiyaci olan tam olarak budur.
      # Bu yuzden anahtar olsun olmasin HER CALISMADA uretilir.
      - name: Telefona kurulabilen APK derle (debug, otomatik imzali)
        working-directory: android
        run: |
          ./gradlew assembleDebug --no-daemon \
            -PoynaVersionCode=${{ steps.ver.outputs.code }} \
            -PoynaVersionName=${{ steps.ver.outputs.name }}

      - name: Paketleri isimlendir
        id: out
        run: |
          S="${{ steps.ver.outputs.name }}-${{ steps.ver.outputs.code }}"
          mkdir -p cikti

          # 1) Play'e yuklenecek paket
          cp android/app/build/outputs/bundle/release/*.aab "cikti/oyna-$S-PLAY.aab"

          # 2) Yayin APK'si (yalniz istendiyse)
          if [ -d android/app/build/outputs/apk/release ]; then
            cp android/app/build/outputs/apk/release/*.apk \
               "cikti/oyna-$S-release.apk" 2>/dev/null || true
          fi

          # 3) Telefona kurulabilen paket — dosya adi ne ise yaradigini SOYLESIN,
          #    kurucu uc dosya arasinda hangisini kuracagini tahmin etmesin.
          cp android/app/build/outputs/apk/debug/*.apk \
             "cikti/oyna-$S-TELEFONA-KUR.apk"

          ls -lh cikti

      - name: Paketi yukle (indirilebilir cikti)
        uses: actions/upload-artifact@v4
        with:
          name: oyna-android-${{ steps.ver.outputs.name }}-${{ steps.ver.outputs.code }}
          path: cikti/*
          retention-days: 30
          if-no-files-found: error

      # ── GECICI TESLIMAT KANCASI ──────────────────────────────────────────
      # NEDEN VAR: Actions "artifact" dosyalari Azure blob adresinden sunuluyor.
      # Kurucuya paketi hazirlayan calisma ortamlarinda o adres kapali olabiliyor;
      # git ise acik. Bu adim, kurulabilir APK'yi gecici bir dala koyar ki paket
      # git uzerinden alinip kurucuya dogrudan verilebilsin.
      #
      # SADECE asagidaki dalda calisir; ana dala karisirsa kendiliginden atil kalir.
      # Teslimattan sonra hem bu adim hem de "teslimat/apk" dali SILINIR.
      - name: APK'yi gecici git dalina koy (teslimat)
        if: github.ref_name == 'claude/oyna-advisory-prompt-8s4x3m'
        run: |
          set -e
          APK=$(ls cikti/*TELEFONA-KUR.apk | head -1)
          echo "Teslim edilecek: $APK ($(du -h "$APK" | cut -f1))"

          cp "$APK" /tmp/teslim.apk
          git config user.name  "OYNA Teslimat"
          git config user.email "noreply@anthropic.com"

          # Gecmisi olmayan tek islemelik dal: depo gecmisi sismesin.
          git checkout --orphan teslimat/apk
          git rm -rf --cached . >/dev/null 2>&1 || true
          find . -maxdepth 1 -mindepth 1 -not -name .git -exec rm -rf {} +

          cp /tmp/teslim.apk "$(basename "$APK")"
          printf '%s\n' \
            "# OYNA — kurulabilir APK" "" \
            "Bu dal GECICIDIR, yalniz paketi tasimak icin var." \
            "Alindiktan sonra silinmeli:" "" \
            "    git push origin --delete teslimat/apk" > README.md

          git add -A
          git commit -q -m "APK teslim: $(basename "$APK")"
          git push -f origin teslimat/apk
          echo "::notice::teslimat/apk dalina konuldu: $(basename "$APK")"

      - name: Ozet
        run: |
          {
            echo "## OYNA Android paketi hazir"
            echo ""
            echo "| Alan | Deger |"
            echo "|---|---|"
            echo "| Surum adi | \`${{ steps.ver.outputs.name }}\` |"
            echo "| Surum kodu (versionCode) | \`${{ steps.ver.outputs.code }}\` |"
            echo "| Imzali mi | \`${{ steps.signing.outputs.signed }}\` |"
            echo "| Paket kimligi | \`com.oyna.app\` |"
            echo ""
            echo "### Hangi dosya ne ise yarar"
            echo ""
            echo "| Dosya | Ne icin |"
            echo "|---|---|"
            echo "| \`...-TELEFONA-KUR.apk\` | **Kendi Android telefonuna kurmak icin.** Her zaman calisir. |"
            echo "| \`...-PLAY.aab\` | Google Play Console'a yuklemek icin. |"
            echo "| \`...-release.apk\` | Yayin surumu APK (yalniz istendiginde uretilir). |"
            echo ""
            echo "**Telefona nasil kurulur:** APK'yi telefona gonder (WhatsApp/Drive/e-posta),"
            echo "dosyaya dokun, \"Bilinmeyen kaynaklara izin ver\" cikarsa izin ver, Kur."
            echo ""
            if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
              echo "**Play icin:** \`-PLAY.aab\` dosyasini indir ->"
              echo "Play Console -> Uretim (Production) -> Yeni surum olustur -> dosyayi surukle."
            else
              echo "**DIKKAT:** \`-PLAY.aab\` ve \`-release.apk\` IMZASIZ uretildi;"
              echo "Play Console kabul etmez ve release APK telefona KURULMAZ."
              echo "Imzalama secret'larini ekleyip isi tekrar calistir."
              echo "Telefonda denemek icin \`-TELEFONA-KUR.apk\` dosyasini kullan — o imzali."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
