name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  quality-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # tsc --noEmit (tip kontrolü) + vitest birim testleri + prod build
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build

  admin-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Bundled Chromium; playwright.config.ts kanal zorlamaz (CI-dostu varsayılan)
      - run: npx playwright install chromium --with-deps
      - run: npm run test:admin
        env:
          CI: true
