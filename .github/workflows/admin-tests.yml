name: Admin Panel Tests

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  admin-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: npm run test:admin
        env:
          CI: true
