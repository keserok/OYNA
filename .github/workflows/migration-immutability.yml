# Migration dosyaları DEĞİŞMEZDİR (ledger sözleşmesi).
# PR'da supabase/migrations/ altında yeniden adlandırma/düzenleme/silme yakalanırsa
# iş başarısız olur — yalnız YENİ dosya eklemek serbesttir.
# Gerekçe: 2026-07-21 ledger drift onarımı (bkz. supabase/MIGRATION_PLAYBOOK.md).
name: migration-immutability

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'

jobs:
  immutability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Var olan migration'lara dokunulmadığını doğrula
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          # SABİT İSTİSNA (2026-07-21 drift onarımı): 5 standart-dışı sürüm
          # numarası 14 haneye normalize edildi (ledger'da aynı gün eşlendi).
          # YALNIZ bu beş eski→yeni çift affedilir; başka hiçbir R/M/D geçmez.
          cat > /tmp/allowed_renames.tsv <<'EOF'
          supabase/migrations/20260529_conflict_prevention.sql	supabase/migrations/20260529000000_conflict_prevention.sql
          supabase/migrations/20260531000_rls_complete.sql	supabase/migrations/20260531000000_rls_complete.sql
          supabase/migrations/20260531001_security_hardening.sql	supabase/migrations/20260531000001_security_hardening.sql
          supabase/migrations/20260608_match_join_rpc_fixes.sql	supabase/migrations/20260608000000_match_join_rpc_fixes.sql
          supabase/migrations/202607130000155_baseline_priv_fns_admin_core.sql	supabase/migrations/20260712235959_baseline_priv_fns_admin_core.sql
          EOF
          # SABİT İSTİSNA (2026-07-29, depo sahibi onayıyla) — SIFIRDAN REPLAY
          # ONARIM KAMPANYASI. Bu dal, migration zinciri sıfırdan hiç
          # çalıştırılmadan büyümüştü; yerel replay (374 dosya, boş küme) beş
          # kırılma buldu. Hatalar geçmişin ORTASINDA oluştuğu için sonraki
          # hiçbir migration onları önleyemezdi — düzeltme kaynakta zorunluydu.
          # Eklenen her şey idempotenttir ve CANLIDA ETKİSİZDİR; yalnız
          # sıfırdan replay'i onarır. Doğrulama: replay 374/374 yeşil.
          #
          #  20260530000000  goalkeepers/referees `match_count` → "matchCount"
          #                  (üretim ve uygulama kodu camelCase kullanıyor;
          #                   repo snake_case yaratıyordu → 20260816000001 düşüyordu)
          #  20260803000003  get_current_tariff_price: 4 argümanlı sürüm için
          #                  DROP eksikti → 42P13 dönüş tipi çakışması
          #  20260827000001  invite_friends_to_match (integer) için DROP eksikti
          #  20260827000003  invite_friends_to_match (jsonb) için DROP eksikti
          #
          # YENİ AF YOKTUR — bu liste yalnız yukarıdaki dört onarımı kapsar ve
          # büyütülmez. Başka bir migration değiştirilirse bekçi yakalar.
          cat > /tmp/allowed_modifications.txt <<'EOF'
          supabase/migrations/20260530000000_service_integration.sql
          supabase/migrations/20260803000003_saha_bazli_tarife.sql
          supabase/migrations/20260827000001_mac_kur_atomik_yayin.sql
          supabase/migrations/20260827000003_mac_kur_kadro_ve_saglayici.sql
          EOF
          # A=eklendi serbest; M=değişti, D=silindi, R=yeniden adlandı → ihlal
          VIOLATIONS=$(git diff --name-status --diff-filter=MDR "$BASE" "$HEAD" -- 'supabase/migrations/*.sql' \
            | awk -F'\t' 'BEGIN { while ((getline line < "/tmp/allowed_renames.tsv") > 0) { split(line, a, "\t"); ok[a[1] "\t" a[2]] = 1 }
                                  while ((getline line < "/tmp/allowed_modifications.txt") > 0) { okmod[line] = 1 } }
                          { if ($1 ~ /^R100$/ && ok[$2 "\t" $3]) next; if ($1 ~ /^M/ && okmod[$2]) next; print }' || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "❌ Var olan migration dosyaları değiştirilemez/yeniden adlandırılamaz/silinemez:"
            echo "$VIOLATIONS"
            echo "Düzeltme gerekiyorsa YENİ bir migration ekleyin (bkz. supabase/MIGRATION_PLAYBOOK.md)."
            exit 1
          fi
          echo "✅ Yalnız yeni migration dosyaları eklenmiş."
