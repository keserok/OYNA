# OYNA yerel PostgREST yapılandırması (yalnız ekran görüntüsü içindir)
db-uri = "postgresql://authenticator@127.0.0.1:55432/oyna"
db-schemas = "public"
db-anon-role = "anon"
db-extra-search-path = "public, extensions"
db-pool = 10

server-host = "127.0.0.1"
server-port = 3001

jwt-secret = "oyna-local-screenshot-secret-min-32-characters"
jwt-aud = "authenticated"

# Şema önbelleğini elle yenilemek gerekmesin
db-channel-enabled = false
log-level = "error"
